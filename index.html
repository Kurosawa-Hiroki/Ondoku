<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英語おんどく ろくおん＆文字起こし</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", MeiRyo, sans-serif;
            background-color: #f0f9ff;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .app-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.15);
            text-align: center;
            border: 4px solid #bae6fd;
        }

        h1 {
            color: #0284c7;
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .recording-status {
            height: 24px;
            margin-bottom: 10px;
            font-weight: bold;
            color: #ef4444;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            visibility: hidden;
        }

        .recording-status.active { visibility: visible; }

        .pulse-dot {
            width: 12px;
            height: 12px;
            background-color: #ef4444;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.5; }
            100% { transform: scale(0.95); opacity: 1; }
        }

        .timer-display {
            font-size: 2.2rem;
            font-weight: bold;
            color: #475569;
            background-color: #f1f5f9;
            padding: 8px 16px;
            border-radius: 16px;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        /* ボタンを横並び（2行2列）に配置するスタイル */
        .btn-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn {
            font-size: 0.95rem;
            font-weight: bold;
            padding: 12px 10px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
            box-sizing: border-box;
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 3px rgba(0, 0, 0, 0.1);
        }

        .btn:disabled {
            background-color: #cbd5e1 !important;
            color: #94a3b8 !important;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .btn-record { background-color: #ff6b6b; color: white; }
        .btn-record:hover:not(:disabled) { background-color: #fa5252; }

        .btn-stop { background-color: #64748b; color: white; }
        .btn-stop:hover:not(:disabled) { background-color: #475569; }

        .btn-play { background-color: #4ade80; color: #14532d; }
        .btn-play:hover:not(:disabled) { background-color: #22c55e; color: white; }

        .btn-retry { background-color: #f59e0b; color: white; }
        .btn-retry:hover:not(:disabled) { background-color: #d97706; }

        .btn-download { background-color: #0284c7; color: white; }
        .btn-download:hover:not(:disabled) { background-color: #0369a1; }

        /* Google Classroomを開くボタン用のスタイル */
        .btn-classroom { 
            background-color: #0f9d58; 
            color: white; 
            width: 100%;
            box-sizing: border-box;
        }
        .btn-classroom:hover { background-color: #0b8043; }

        /* 再生用プレイヤーとコントロールパネル */
        .audio-player-container {
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .audio-player-container audio {
            width: 100%;
        }

        .audio-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-control {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .btn-control:hover:not(:disabled) {
            background-color: #0369a1;
        }

        .btn-control:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
        }

        .speed-select-label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #475569;
            margin-left: 5px;
        }

        .speed-select {
            padding: 6px 10px;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            font-size: 0.85rem;
            font-weight: bold;
            color: #334155;
            outline: none;
            background-color: white;
        }

        .transcript-container {
            margin-bottom: 20px;
            text-align: left;
        }

        .transcript-label {
            font-size: 0.9rem;
            font-weight: bold;
            color: #059669;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* 文字起こし用テキストエリア（Centuryフォント / 高さ150px） */
        .transcript-box {
            width: 100%;
            height: 150px;
            padding: 12px;
            border: 2px solid #a7f3d0;
            border-radius: 12px;
            background-color: #f0fdf4;
            font-family: "Century", "Century Schoolbook", "TeX Gyre Schola", serif;
            font-size: 1.15rem;
            line-height: 1.5;
            color: #333;
            box-sizing: border-box;
            resize: none;
            outline: none;
        }

        .submission-area {
            border-top: 2px dashed #bae6fd;
            padding-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .btn-complete {
            background-color: #8b5cf6;
            color: white;
            width: 100%;
        }

        .btn-complete:hover:not(:disabled) {
            background-color: #7c3aed;
        }

        .recognition-note {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 6px;
            line-height: 1.4;
        }

    </style>
</head>
<body>

    <div class="app-card">
        <h1>📖 英語おんどくアプリ</h1>

        <div class="recording-status" id="recordingStatus">
            <div class="pulse-dot"></div>
            <span>ろくおん＆文字おこし中...</span>
        </div>

        <div class="timer-display" id="timer">00:00</div>

        <!-- 録音操作ボタン群（横並び2列） -->
        <div class="btn-container">
            <button id="startBtn" class="btn btn-record">
                🎤 ろくおん
            </button>
            <button id="stopBtn" class="btn btn-stop" disabled>
                ⏹️ ストップ
            </button>
            <button id="playBtn" class="btn btn-play" disabled>
                ▶️ きいてみる
            </button>
            <button id="retryBtn" class="btn btn-retry" disabled>
                🔄 もういちど
            </button>
        </div>

        <!-- 文字起こしエリア（ボタンの真下） -->
        <div class="transcript-container">
            <div class="transcript-label">
                <span>🗣️ あなたが発音した英語（文字起こし）:</span>
            </div>
            <textarea id="transcriptBox" class="transcript-box" readonly placeholder="ろくおんを開始すると、ここに文字が表示されます..."></textarea>
            <div class="recognition-note">
                ※ iPhoneではSafariを、AndroidではGoogle Chromeのご使用を推奨します。初回はマイクのアクセスを「許可」してください。
            </div>
        </div>

        <!-- 音声プレイヤー ＆ コントロールパネル -->
        <div class="audio-player-container">
            <audio id="audioPlayer" controls></audio>
            <div class="audio-controls">
                <button id="rewindBtn" class="btn-control" disabled>↺ 5秒戻る</button>
                <button id="forwardBtn" class="btn-control" disabled>5秒進む ↻</button>
                <span class="speed-select-label">はやさ:</span>
                <select id="speedSelect" class="speed-select" disabled>
                    <option value="0.75">0.75倍 (ゆっくり)</option>
                    <option value="1.0" selected>1.0倍 (標準)</option>
                    <option value="1.25">1.25倍 (やや速い)</option>
                    <option value="1.5">1.5倍 (速い)</option>
                </select>
            </div>
        </div>

        <div class="submission-area">
            <div class="recognition-note" style="width:100%;">
                「ろくおん」→ 音読 →「ストップ」→「音読を完了」の順で操作します。
            </div>
            <button id="completeBtn" class="btn btn-complete" disabled>
                ✅ 音読を完了
            </button>

            <button id="downloadBtn" class="btn btn-download" style="width:100%;" disabled>
                💾 音声（おんせい）ファイルを保存
            </button>

            <!-- Google Classroom を別タブで開くボタン -->
            <a href="https://classroom.google.com/" target="_blank" rel="noopener noreferrer" class="btn btn-classroom">
                🏫 Google Classroom をひらく
            </a>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const playBtn = document.getElementById('playBtn');
        const retryBtn = document.getElementById('retryBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const completeBtn = document.getElementById('completeBtn');
        const timerDisplay = document.getElementById('timer');
        const recordingStatus = document.getElementById('recordingStatus');
        const audioPlayer = document.getElementById('audioPlayer');
        const transcriptBox = document.getElementById('transcriptBox');

        const rewindBtn = document.getElementById('rewindBtn');
        const forwardBtn = document.getElementById('forwardBtn');
        const speedSelect = document.getElementById('speedSelect');

        let mediaRecorder;
        let audioChunks = [];
        let audioBlob = null;
        let audioUrl = null;
        let timerInterval;
        let seconds = 0;
        let isRecording = false;

        let finalTranscript = '';
        let wakeLock = null; // スリープ防止用オブジェクト

        function formatTranscript(text) {
            if (!text) return '';

            let formatted = text
                .replace(/\b(period|full stop)\b/gi, '.')
                .replace(/ピリオド/g, '.')
                .replace(/\b(question mark)\b/gi, '?')
                .replace(/クエスチョンマーク/g, '?')
                .replace(/\b(comma)\b/gi, ',')
                .replace(/カンマ/g, ',');

            formatted = formatted.replace(/\s+([.?,])/g, '$1');

            formatted = formatted.replace(/(?:^|[.?!]\s*)([a-z])/g, (match, letter) => {
                return match.replace(letter, letter.toUpperCase());
            });

            return formatted;
        }

        // --- iPhone (iOS) 強化版 音声認識の設定 ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        let recognitionRunning = false;
        let recognitionRestartTimer = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            
            // iOS等で無音時に途切れにくくするため continuous を true に設定
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                recognitionRunning = true;
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const result = event.results[i];
                    if (result.isFinal) {
                        finalTranscript += result[0].transcript.trim() + ' ';
                    } else {
                        interimTranscript += result[0].transcript;
                    }
                }
                transcriptBox.value = formatTranscript(finalTranscript + interimTranscript);
                transcriptBox.scrollTop = transcriptBox.scrollHeight;
            };

            // iOS等で認識が終了しても、録音中であれば即座に再起動
            recognition.onend = () => {
                recognitionRunning = false;
                if (isRecording) {
                    clearTimeout(recognitionRestartTimer);
                    recognitionRestartTimer = setTimeout(() => {
                        if (!isRecording || recognitionRunning) return;
                        try {
                            recognition.start();
                        } catch (e) {
                            console.log("音声認識再起動:", e);
                        }
                    }, 200);
                }
            };

            recognition.onerror = (event) => {
                recognitionRunning = false;
                console.warn("音声認識エラー:", event.error);

                if (isRecording && ['no-speech', 'audio-capture', 'network', 'aborted'].includes(event.error)) {
                    clearTimeout(recognitionRestartTimer);
                    recognitionRestartTimer = setTimeout(() => {
                        if (!isRecording || recognitionRunning) return;
                        try {
                            recognition.start();
                        } catch (e) {}
                    }, 300);
                }

                if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                    transcriptBox.value =
                        "※ マイクへのアクセスが許可されていません。ブラウザのサイト設定でマイクを「許可」にしてください。";
                }
            };
        } else {
            transcriptBox.value =
                "※ お使いのブラウザは音声認識に対応していません。iPhoneはSafari、AndroidはGoogle Chromeを使用してください。";
        }

        // 録音中の画面スリープを防止する関数 (Wake Lock API)
        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {
                    console.log('Wake Lock Error:', err);
                }
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release();
                wakeLock = null;
            }
        }

        function updateTimer() {
            seconds++;
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            timerDisplay.textContent = `${mins}:${secs}`;
        }

        function resetTimer() {
            clearInterval(timerInterval);
            seconds = 0;
            timerDisplay.textContent = "00:00";
        }

        // 録音開始
        startBtn.addEventListener('click', async () => {
            try {
                if (!window.isSecureContext) {
                    alert('このアプリはHTTPS（例：GitHub Pages等）の保護された環境で開いてください。');
                    return;
                }
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    alert('このブラウザではマイク機能が使えません。');
                    return;
                }

                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                // Safari / Chrome 対応の MIME Type 選択
                let options = {};
                if (MediaRecorder.isTypeSupported('audio/mp4')) {
                    options = { mimeType: 'audio/mp4' };
                } else if (MediaRecorder.isTypeSupported('audio/webm')) {
                    options = { mimeType: 'audio/webm' };
                }

                mediaRecorder = new MediaRecorder(stream, options);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    const mimeType = mediaRecorder.mimeType || 'audio/webm';
                    audioBlob = new Blob(audioChunks, { type: mimeType });
                    audioUrl = URL.createObjectURL(audioBlob);
                    audioPlayer.src = audioUrl;

                    playBtn.disabled = false;
                    retryBtn.disabled = false;
                    downloadBtn.disabled = false;
                    completeBtn.disabled = false;
                    rewindBtn.disabled = false;
                    forwardBtn.disabled = false;
                    speedSelect.disabled = false;

                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                isRecording = true;
                finalTranscript = '';

                // スリープ防止を有効化
                await requestWakeLock();

                if (recognition) {
                    transcriptBox.value = '';
                    clearTimeout(recognitionRestartTimer);
                    recognitionRunning = false;
                    try {
                        recognition.start();
                    } catch(e) {
                        console.log("音声認識起動待機:", e);
                        setTimeout(() => {
                            if (isRecording && !recognitionRunning) {
                                try { recognition.start(); } catch(e2) {}
                            }
                        }, 300);
                    }
                }

                resetTimer();
                timerInterval = setInterval(updateTimer, 1000);
                recordingStatus.classList.add('active');

                startBtn.disabled = true;
                stopBtn.disabled = false;
                playBtn.disabled = true;
                retryBtn.disabled = true;
                downloadBtn.disabled = true;
                completeBtn.disabled = true;
                rewindBtn.disabled = true;
                forwardBtn.disabled = true;
                speedSelect.disabled = true;

            } catch (err) {
                alert('マイクへのアクセスが拒否されたか、マイクが見つかりませんでした。');
                console.error(err);
            }
        });

        // 録音停止
        stopBtn.addEventListener('click', () => {
            // スリープ防止を解除
            releaseWakeLock();

            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                isRecording = false;
                mediaRecorder.stop();
                clearInterval(timerInterval);

                clearTimeout(recognitionRestartTimer);
                if (recognition) {
                    try { recognition.stop(); } catch(e) {}
                    recognitionRunning = false;
                }

                recordingStatus.classList.remove('active');
                startBtn.disabled = false;
                stopBtn.disabled = true;
            }
        });

        // 再生ボタン
        playBtn.addEventListener('click', () => {
            if (audioUrl) {
                audioPlayer.play();
            }
        });

        // リトライボタン
        retryBtn.addEventListener('click', () => {
            audioPlayer.pause();
            audioPlayer.src = "";
            audioUrl = null;
            audioBlob = null;
            finalTranscript = '';

            resetTimer();
            transcriptBox.value = "";

            playBtn.disabled = true;
            retryBtn.disabled = true;
            downloadBtn.disabled = true;
            completeBtn.disabled = true;
            startBtn.disabled = false;
            stopBtn.disabled = true;

            rewindBtn.disabled = true;
            forwardBtn.disabled = true;
            speedSelect.disabled = true;
            speedSelect.value = "1.0";
            audioPlayer.playbackRate = 1.0;
        });

        // 完了ボタン
        completeBtn.addEventListener('click', () => {
            alert('音読が完了しました！必要に応じて音声ファイルを保存して提出してください。');
        });

        // 音声保存ボタン
        downloadBtn.addEventListener('click', () => {
            if (!audioBlob) return;

            const now = new Date();
            const timeString = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
            
            // iOS Safari向けの拡張子調整
            const ext = audioBlob.type.includes('mp4') ? 'm4a' : 'webm';
            const fileName = `ondoku_${timeString}.${ext}`;

            const a = document.createElement('a');
            a.href = audioUrl;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });

        // 5秒戻る
        rewindBtn.addEventListener('click', () => {
            audioPlayer.currentTime = Math.max(0, audioPlayer.currentTime - 5);
        });

        // 5秒進む
        forwardBtn.addEventListener('click', () => {
            audioPlayer.currentTime = Math.min(audioPlayer.duration || 0, audioPlayer.currentTime + 5);
        });

        // 再生速度の変更
        speedSelect.addEventListener('change', (e) => {
            audioPlayer.playbackRate = parseFloat(e.target.value);
        });
    </script>
</body>
</html>
